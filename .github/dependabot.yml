version: 2
updates:
  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  # Pub dependencies for root & workspace packages
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pub-dependencies:
        patterns:
          - "*"
    ignore:
      # cross_file 0.4 breaks apps that also use image_picker, file_selector
      # or camera, which still require 0.3. It ships with 14.0.0 (#2236).
      - dependency-name: "cross_file"
        versions: [">=0.4.0"]

  - package-ecosystem: "pub"
    directory: "/packages/file_picker_platform_interface"
    schedule:
      interval: "weekly"
    groups:
      pub-dependencies:
        patterns:
          - "*"
    ignore:
      # cross_file 0.4 breaks apps that also use image_picker, file_selector
      # or camera, which still require 0.3. It ships with 14.0.0 (#2236).
      - dependency-name: "cross_file"
        versions: [">=0.4.0"]

  - package-ecosystem: "pub"
    directory: "/packages/file_picker_android"
    schedule:
      interval: "weekly"
    groups:
      pub-dependencies:
        patterns:
          - "*"
    ignore:
      # cross_file 0.4 breaks apps that also use image_picker, file_selector
      # or camera, which still require 0.3. It ships with 14.0.0 (#2236).
      - dependency-name: "cross_file"
        versions: [">=0.4.0"]

  - package-ecosystem: "pub"
    directory: "/packages/file_picker_darwin"
    schedule:
      interval: "weekly"
    groups:
      pub-dependencies:
        patterns:
          - "*"
    ignore:
      # cross_file 0.4 breaks apps that also use image_picker, file_selector
      # or camera, which still require 0.3. It ships with 14.0.0 (#2236).
      - dependency-name: "cross_file"
        versions: [">=0.4.0"]

  - package-ecosystem: "pub"
    directory: "/packages/file_picker_linux"
    schedule:
      interval: "weekly"
    groups:
      pub-dependencies:
        patterns:
          - "*"
    ignore:
      # cross_file 0.4 breaks apps that also use image_picker, file_selector
      # or camera, which still require 0.3. It ships with 14.0.0 (#2236).
      - dependency-name: "cross_file"
        versions: [">=0.4.0"]

  - package-ecosystem: "pub"
    directory: "/packages/file_picker_windows"
    schedule:
      interval: "weekly"
    groups:
      pub-dependencies:
        patterns:
          - "*"
    ignore:
      # cross_file 0.4 breaks apps that also use image_picker, file_selector
      # or camera, which still require 0.3. It ships with 14.0.0 (#2236).
      - dependency-name: "cross_file"
        versions: [">=0.4.0"]

  - package-ecosystem: "pub"
    directory: "/packages/file_picker_web"
    schedule:
      interval: "weekly"
    groups:
      pub-dependencies:
        patterns:
          - "*"
    ignore:
      # cross_file 0.4 breaks apps that also use image_picker, file_selector
      # or camera, which still require 0.3. It ships with 14.0.0 (#2236).
      - dependency-name: "cross_file"
        versions: [">=0.4.0"]

  - package-ecosystem: "pub"
    directory: "/example"
    schedule:
      interval: "weekly"
    groups:
      pub-dependencies:
        patterns:
          - "*"
    ignore:
      # cross_file 0.4 breaks apps that also use image_picker, file_selector
      # or camera, which still require 0.3. It ships with 14.0.0 (#2236).
      - dependency-name: "cross_file"
        versions: [">=0.4.0"]

  # Gradle dependencies for Android native plugin
  - package-ecosystem: "gradle"
    directory: "/packages/file_picker_android/android"
    schedule:
      interval: "weekly"
    groups:
      gradle-dependencies:
        patterns:
          - "*"
    ignore:
      # Pinned on purpose in the module's buildscript, see the comment there
      # (#2170).
      - dependency-name: "org.jetbrains.kotlin:kotlin-gradle-plugin"
      - dependency-name: "com.android.tools.build:gradle"
      # 1.19 requires compileSdk 37 and Android Gradle plugin 9.1, which would
      # force every app using the plugin onto them (#2273).
      - dependency-name: "androidx.core:core"
        versions: [">=1.19.0"]
      - dependency-name: "androidx.core:core-ktx"
        versions: [">=1.19.0"]
