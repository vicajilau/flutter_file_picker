name: file_picker_example
description: An example of how to use the file_picker plugin.
publish_to: 'none'

resolution: workspace

environment:
  sdk: ">=3.10.0 <4.0.0"

formatter:
  page_width: 80

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^13.0.0
  android_file_picker: ^2.0.0
  file_picker_darwin: ^2.0.0
  file_picker_linux: ^2.0.0
  file_picker_web: ^4.0.0
  windows_file_picker: ^2.0.0
  file: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true