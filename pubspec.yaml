name: flutter_file_picker_workspace
description: Root workspace definition for flutter_file_picker repository.
publish_to: none

workspace:
  - packages/file_picker
  - packages/file_picker_platform_interface
  - packages/file_picker_android
  - packages/file_picker_darwin
  - packages/file_picker_linux
  - packages/file_picker_windows
  - packages/file_picker_web
  - example

melos:
  packages:
    - packages/*
    - example
  scripts:
    analyze:
      exec: flutter analyze .
      description: Run flutter analyze in all packages.

    test:
      exec: flutter test
      concurrency: 1
      description: Run flutter test in all packages.

    # Requires a chromedriver matching your local Chrome running first, e.g.
    # `chromedriver --port=4444`. See example/test_driver/integration_test.dart
    # for why `flutter drive` alone is not enough on web.
    test:integration_web:
      exec: >
        flutter drive
        -d web-server --web-port=7357
        --browser-name=chrome
        --headless
        --driver=test_driver/integration_test.dart
        --target=integration_test/pick_file_web_test.dart
      packageFilters:
        dirExists: test_driver
      description: Run the web integration_test suite against the example app.

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  melos: ^8.2.2
